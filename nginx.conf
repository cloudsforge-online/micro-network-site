# Forge Network's server block.
#
# THE ONE THING TO UNDERSTAND HERE: an unknown path answers 404, not 200.
#
# The usual SPA fallback is `try_files $uri /index.html`, which serves the bundle with a 200 for
# every address in existence. That makes a "page not found" screen a success: search engines index
# it, uptime checks call it healthy, link checkers pass, and a deploy that drops a route looks
# exactly like a deploy that did not.
#
# It matters here for a reason specific to this surface. `/faucet` is not a path this repository
# invented — it is the registry's `basePath` for the `faucet` surface
# (`ui/packages/ui/src/surfaces.ts:374`), so every link to the faucet from anywhere in the estate
# resolves to it. A deploy that dropped that route while still answering 200 would leave six other
# repositories linking to a page that renders "not found" and reports success to every machine that
# checks it.
#
# So the client routes are ENUMERATED below, and everything else falls through to
# `error_page 404 /index.html`, which serves the same bundle while KEEPING the 404 status. React
# renders NotFoundPage inside it, and the status line tells the truth.
#
# The cost is that this list and `ROUTES` in src/lib/routes.ts must agree. That is one line per
# route, paid once per route, and `test/routes.test.ts` reads this file and fails the build when
# they drift. "Remember to update nginx.conf" is not a mechanism; a test is.
#
# ── There is no proxy in this file, and that is deliberate ────────────────────────────────────
#
# This bundle reads two services and neither is proxied here. Routing `/v1` to `micro-indexer` or
# `micro-faucet` is the gateway's job (`deploy/gateway/dynamic/policy.yml`), not this container's,
# and a `proxy_pass` here would need an upstream hostname — which is an ENVIRONMENT baked into an
# image that is built once and promoted. See the header of the Dockerfile.
#
# A proxy that added an `Authorization` header would be worse still. It would put a CloudsForge
# service credential inside a published image, and it is not even needed: every route this bundle
# calls is anonymous. `authoriseRead` serves a caller with no token
# (`indexer/src/server.ts:708-717`) and the three faucet routes are unauthenticated by that
# service's own decision (`faucet/src/server.ts:334-335`). The `rules` job in CI greps this file
# and the Dockerfile for both.

# Which environment is this? A testnet or preview host must never invite a crawler, and must never
# publish a sitemap — two estates sharing one apex means an indexed testnet page competes with the
# mainnet page it is a copy of, under a hostname that answers with worthless EMBER.
#
# The pattern matches both shapes deliberately: the single-label `network-testnet.` the estate uses
# now, and the older two-label `network.testnet.` which still resolves.
map $host $cf_env {
    default '';
    ~^(?:[^.]+-)?(?:testnet|staging|preview|dev|mainnet)\. 'yes';
}

server {
    # 8080 because the image is nginx-unprivileged: nothing in this container is root, and a
    # non-root process cannot bind 80.
    #
    # It is NOT this surface's registry devPort. The registry gives `network` **3003**
    # (`ui/packages/ui/src/surfaces.ts:193`), which is the port the surface answers on in the local
    # stack; 8080 is the port inside the container, and the two are mapped by whatever runs it. The
    # explorer's nginx.conf claims the two are the same number and that claim went stale when
    # micro-ui corrected its registry row — reported, and not repeated here.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing is real routing: the address must survive a hard refresh.
    absolute_redirect off;

    # ---- security headers ------------------------------------------------
    # SAMEORIGIN rather than DENY: this is a public marketing and reference surface with legitimate
    # same-origin embeds inside Hub, unlike the operator console, which has none and uses DENY.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- assets ----------------------------------------------------------
    # Immutable, because every build emits new hashed filenames. A missing asset is a 404 on its
    # own terms and must NOT fall through to the app shell: a JavaScript request answered with
    # HTML fails with a syntax error that names the wrong file.
    location /assets/ {
        try_files $uri =404;
        # REPEATED, NOT INHERITED. nginx's `add_header` is all-or-nothing per level: a location
        # that declares ANY add_header inherits NONE from its parent. So every location below that
        # sets Cache-Control must restate the security headers, or it silently serves without them
        # — which is exactly what `location /assets/` did in the template, stripping nosniff from
        # every hashed script in every frontend cut from it.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html is never cached. It is the file that names the current asset hashes, so a stale
    # copy pins a browser to a deploy that no longer exists.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- the client routes, enumerated -----------------------------------
    # Keep in step with ROUTES in src/lib/routes.ts. test/routes.test.ts reads both.
    location = / {
        try_files /index.html =404;
        # `try_files` is a FILE LOOKUP, not an internal redirect, so serving /index.html here does
        # NOT re-enter `location = /index.html` above — and this location therefore has to declare
        # the shell's no-store itself. Without it `/` shipped with no Cache-Control at all, which
        # is the one document that must never be cached: it names the hashed bundle.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # `/?$` AND NOT `(/|$)`, AND THE DIFFERENCE IS WHAT THIS WHOLE FILE IS FOR.
    #
    # `(/|$)` is a PREFIX: it matched /faucet, and it also matched /faucet/history, /chain/ember and
    # every other address beneath a route this app owns. `src/app.tsx` routes none of them — no
    # route here takes a parameter, deliberately, because looking up a block or an address is the
    # block explorer's job — so React rendered NotFoundPage and nginx served it with a 200. The
    # not-found page delivered as a success is precisely the failure the header of this file says
    # the enumeration exists to prevent.
    #
    # /faucet/history is not a hypothetical address. The faucet's drip poll is `/v1/drips/:id` and
    # a reader guessing at a history page is guessing at the obvious spelling.
    #
    # The same defect was in micro-web-template and in every frontend cut from it; `site` records
    # finding it a third time in `/products/pay`. It was found here by a browser scenario probing
    # the address, not by reading the file.
    location ~ ^/(chain|mine|node|faucet)/?$ {
        try_files /index.html =404;
        # Same reason as `location = /` above: try_files does not re-enter, so restate them all.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- everything else -------------------------------------------------
    # A real file (favicon, the og card, robots.txt) is served; anything else 404s, and the error
    # page below turns that 404 into the app shell WITHOUT changing the status.
    location / {
        try_files $uri =404;
    }

    error_page 404 /index.html;

    # nginx's own health, for the container probe. It answers before the app has been fetched, so
    # it says the server is up — never that the product works. That is Beacon's job, and on this
    # surface a green probe says nothing at all about whether the chain index or the faucet will
    # answer this page.
    # ── SITEMAP AND ROBOTS ────────────────────────────────────────────────
    #
    # Five pages, which is the whole of this surface — the nav in src/lib/routes.ts is the source and
    # test/sitemap.test.ts compares the two, so a page added there and not here fails CI rather than
    # going unindexed quietly.
    #
    # Both refuse on any environment host. A sitemap that lists testnet URLs is an instruction to
    # index them.
    location = /sitemap.xml {
        types { }
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        if ($cf_env) { return 404; }
        return 200 '<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
  <url><loc>$scheme://$host/</loc></url>
  <url><loc>$scheme://$host/chain</loc></url>
  <url><loc>$scheme://$host/mine</loc></url>
  <url><loc>$scheme://$host/node</loc></url>
  <url><loc>$scheme://$host/faucet</loc></url>
</urlset>';
    }

    location = /robots.txt {
        types { }
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        if ($cf_env) { return 200 'User-agent: *\nDisallow: /\n'; }
        return 200 'User-agent: *
Allow: /

Sitemap: $scheme://$host/sitemap.xml
';
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
