<!doctype html>
<!--
  data-cf-product picks the accent ramp and data-cf-substrate the ash ramp, both from
  @cloudsforge/ui/tokens.css. They are on <html> and set STATICALLY here rather than by React,
  because a page that paints before the attributes land flashes the default ember and then changes
  colour.

  'network' — and unlike the explorer, this surface's own key is the right one. tokens.css declares
  `[data-cf-product='network']` at `ui/packages/ui/src/tokens.css`, carrying #d6412f, which
  is the exact accent the registry gives this surface (`ui/packages/ui/src/surfaces.ts`).

  It was checked rather than assumed. tokens.css says that "every key an app may set
  is declared", precisely so a surface cannot fall through to the company ember in silence — which
  is what platform/apps/admin/index.html did for as long as nobody looked. `explorer` is still the
  key with no block of its own; this one has had one since the ramp was written.
  test/brand-chrome.test.ts asserts the selector this file names really exists.

  'warm' is the ash ramp every product frontend in the estate uses.
-->
<html lang="en-GB" data-cf-product="network" data-cf-substrate="warm" data-cf-scheme="auto"><!--
  data-cf-scheme arrived with @cloudsforge/ui 1.1: `auto` follows the reader's operating system,
  `light` and `dark` force one. Set here rather than by React, because a theme flash is worse than
  a theme nobody asked for.

  This surface carried BOTH of the light-mode blockers the design system was written to find, which
  is why it stayed dark while every other surface moved. They are fixed together because each one
  alone still leaves the page wrong: `src/styles.css` declared `color-scheme: dark` on `body`, and a
  declaration on `body` beats the per-scheme one tokens.css sets on `<html>`.
-->
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      `color-scheme`, spelled the way the standard spells it. This was `colour-scheme` — correct
      British English and completely INERT: it is not a registered meta name, no browser has ever
      read it, and the declaration meant to tell the browser which form controls and scrollbars to
      draw did nothing at all. The faucet page is made of a text input and a button, so on this
      surface that is not cosmetic.

      Both schemes, not only `dark`, because `data-cf-scheme="auto"` above lets the token layer
      resolve whichever palette the reader's system asks for.
    -->
    <meta name="color-scheme" content="dark light" />

    <!--
      The Google Analytics property. Nothing is loaded and no cookie is set until the reader presses
      Accept on the consent gate — `initAnalytics()` in src/main.tsx primes Consent Mode with every
      category DENIED before anything else runs. An absent or empty value means analytics is simply
      off, which is what a local `pnpm dev` gets and is a supported mode rather than a
      misconfiguration.
    -->
    <meta name="cf-analytics" content="G-ZFBLKK519K" />
    <!--
      The build that produced this bundle. Stamped by the Dockerfile, read by src/lib/obs.ts, and
      the reason an error report can be pinned to the deploy that introduced it. It is an identity
      rather than a configuration: it names the artefact, it does not tell it where it is running.
    -->
    <meta name="cf-release" content="dev" />

    <!--
      THE DESCRIPTION SAYS THE STATE OF THE CHAIN IN THE SAME SENTENCE AS WHAT IT IS.

      This string is what ends up in a search result and in a link preview, read entirely without
      the page around it — so it is the single easiest place on this surface to imply a running
      network by omission, and now also the easiest place to imply a TRADED one.

      IT USED TO SAY "no mainnet". That is false: `deploy/cloudflared/config.mainnet.public.yml`
      publishes the mainnet JSON-RPC hostname on the public tunnel and it answers from off the
      estate.

      IT THEN SAID "no public testnet endpoint". That is ALSO false, as of 2026-08-05, and it was
      the single most-read false sentence in the estate because a link preview is what a person
      sees before they see anything else. The testnet is public: chain id 7412, JSON-RPC at
      `https://rpc-testnet.cloudsforge.online`, verified answering `0x1cf4`. The old wording blamed
      Cloudflare's one-label Universal SSL, which was the right diagnosis of the WRONG scheme —
      hostnames moved to `<surface>-testnet.<apex>` (one label) instead of
      `<surface>.testnet.<apex>` (two), so the certificate covers them and nothing had to be
      bought. See `ui/packages/ui/src/surfaces.ts`.

      The clause that must never leave is the one about VALUE — no EMBER of any monetary value —
      because a reachable chain is not a traded one and a link preview is exactly where those two
      get blurred. That is now the ONLY clause test/brand-chrome.test.ts pins in this description
      and the og one below, and it is pinned harder because it is no longer travelling with a
      second caveat that softened the page.
    -->
    <meta
      name="description"
      content="EMBER is mined by an ordinary processor, on a chain that speaks Ethereum. Hearth is weeks old, unproven, and its coin has no market and no monetary value."
    />

    <!--
      Brand chrome for the `network` surface, from micro-brand's assets/network/ set, copied
      byte-identical — test/brand-chrome.test.ts compares the bytes in both directions.

      `network` is entitled to the FULL set of eight files (`brand/README.md`) and all eight
      exist in `brand/assets/network/`. Four of them are shipped here, and the choice is the same
      one every frontend in the estate makes: the favicons and the og card are BROWSER CHROME that a
      hostname cannot inherit, and the mark, the wordmark, the as-delivered og source and the social
      banner are not requested by a browser at all.

      The mark is still rendered, and it is rendered as SVG by `<Mark>` from the design system
      (`ui/packages/ui/src/index.tsx`,) rather than as one of these PNGs — so
      it wears `--cf-accent`, stays crisp at any size, and costs no request. `brand/assets/network/`
      keeps the raster copies for the places a browser is not the consumer.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192x192.png" />

    <!--
      ONE og block, not two. foresight-web/index.html declares og:type, og:title and og:description
      twice — the second set silently wins in every crawler and the first is dead text nobody edits.
      Reported there; not repeated here, and test/brand-chrome.test.ts counts each property.

      The image is a RELATIVE path so the card resolves against whichever origin served the page,
      which is the same rule the rest of this bundle follows for hosts.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Forge Network — Hearth and EMBER" />
    <meta
      property="og:description"
      content="EMBER is mined by an ordinary processor, on a chain that speaks Ethereum. Hearth is weeks old, unproven, and its coin has no market and no monetary value."
    />
    <meta property="og:image" content="/og-1200x630.png" />

    <title>Forge Network</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
